        <main class="container">

    <div id="mortgage-calculator">
        <h2>MORTGAGE CALCULATOR</h2>	<img src="img/morg.jpg" alt="Small Image">	
        <label for="loanAmount">Loan Amount ($):</label>
        <input type="number" id="loanAmount" placeholder="Enter loan amount" required>
        
        <label for="interestRate">Interest Rate (%):</label>
        <input type="number" id="interestRate" placeholder="Enter interest rate" required>
        
        <label for="loanTerm">Loan Term (years):</label>
        <input type="number" id="loanTerm" placeholder="Enter loan term" required>
        
        <button onclick="calculateMortgage()">Calculate</button>
        
        <p id="mortgageResult"></p>
		
    </div>

    <!-- Mileage Calculator -->
    <div id="mileage-calculator">
        <h2>MILEAGE CALCULATOR</h2>  <img src="img/mileage.jpg" alt="Small Image">
        <label for="distance">Distance (in miles):</label>
        <input type="number" id="distance" placeholder="Enter distance" required>
        
        <label for="fuel">Fuel Efficiency (miles per gallon):</label>
        <input type="number" id="fuel" placeholder="Enter fuel efficiency" required>
        
        <button onclick="calculateMileage()">Calculate</button>
        
        <p id="mileageResult"></p>
		
    </div>
</main>


		
		
		
		<script>
    // Mortgage Calculator Function
    function calculateMortgage() {
        const loanAmount = parseFloat(document.getElementById('loanAmount').value);
        const interestRate = parseFloat(document.getElementById('interestRate').value) / 100 / 12; // Monthly interest rate
        const loanTerm = parseFloat(document.getElementById('loanTerm').value) * 12; // Total number of payments

        // Calculate monthly mortgage payment
        const monthlyPayment = (loanAmount * interestRate * Math.pow(1 + interestRate, loanTerm)) / (Math.pow(1 + interestRate, loanTerm) - 1);

        // Display the result
        document.getElementById('mortgageResult').innerHTML = `<strong>Monthly Mortgage Payment:</strong> $${monthlyPayment.toFixed(2)}`;
    }

    // Mileage Calculator Function
    function calculateMileage() {
        const distance = parseFloat(document.getElementById('distance').value);
        const fuelEfficiency = parseFloat(document.getElementById('fuel').value);

        // Calculate mileage
        const mileage = distance / fuelEfficiency;

        // Display the result
        document.getElementById('mileageResult').innerHTML = `<strong>Mileage:</strong> ${mileage.toFixed(2)} gallons`;
    }
</script>


		
		
			

<div id="order-invoice" class="container">
    <h2>ORDER FORM</h2>
    <form id="order-form" class="formi">
        <label for="itemName">Item Name:</label>
        <input type="text" id="itemName" placeholder="Enter item name" required><br>

        <label for="itemPrice">Item Price ($):</label>
        <input type="number" id="itemPrice" placeholder="Enter item price" required><br>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" placeholder="Enter quantity" required><br>

        <button type="button" onclick="generateInvoice()">Generate Invoice</button>
    </form>

    <div id="invoice" style="display: none;" class="formi">
        <h2>INVOICE</h2>
        <div id="invoiceDetails"></div>
    </div>
</div>


		<script>// Function to generate invoice
function generateInvoice() {
    const itemName = document.getElementById('itemName').value;
    const itemPrice = parseFloat(document.getElementById('itemPrice').value);
    const quantity = parseFloat(document.getElementById('quantity').value);

    const totalPrice = itemPrice * quantity;

    // Display the invoice
    const invoiceDetails = `
        <p><strong>Item Name:</strong> ${itemName}</p>
        <p><strong>Item Price:</strong> $${itemPrice.toFixed(2)}</p>
        <p><strong>Quantity:</strong> ${quantity}</p>
        <p><strong>Total Price:</strong> $${totalPrice.toFixed(2)}</p>
    `;

    document.getElementById('invoiceDetails').innerHTML = invoiceDetails;
    document.getElementById('invoice').style.display = 'block';
}
</script>
